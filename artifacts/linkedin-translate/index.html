<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LinkedIn Translate</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="LinkedIn Translate" />
    <meta name="description" content="Say what you mean. Sound like a LinkedIn influencer! Turn any casual thought into professional, over-the-top corporate speak instantly." />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LinkedIn Translate" />
    <meta property="og:description" content="Say what you mean. Sound like a LinkedIn influencer! Turn any casual thought into professional, over-the-top corporate speak instantly." />
    <!-- Replace this with an absolute URL to a beautiful 1200x630 banner later if you design one -->
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="LinkedIn Translate" />
    <meta property="twitter:description" content="Say what you mean. Sound like a LinkedIn influencer! Turn any casual thought into professional, over-the-top corporate speak instantly." />
    <meta property="twitter:image" content="/logo.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
